apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def releaseKeystorePropertiesFile = rootProject.file('.signing/keystore.properties')
def releaseKeystoreProperties = new Properties()
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystorePropertiesFile.withInputStream {
        releaseKeystoreProperties.load(it)
    }
}

android {
    namespace 'com.daxiaamu.mijiapanel'
    compileSdk 36

    buildFeatures {
        buildConfig true
        compose true
    }

    defaultConfig {
        applicationId 'com.daxiaamu.mijiapanel'
        minSdk 26
        targetSdk 35
        versionCode project.findProperty('versionCodeOverride')?.toInteger() ?: 8
        versionName project.findProperty('versionNameOverride') ?: '1.1.0-pre'
    }

    signingConfigs {
        debug {
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
        release {
            if (releaseKeystorePropertiesFile.exists()) {
                storeFile new File(
                        releaseKeystorePropertiesFile.parentFile,
                        releaseKeystoreProperties['storeFile'])
                storePassword releaseKeystoreProperties['storePassword']
                keyAlias releaseKeystoreProperties['keyAlias']
                keyPassword releaseKeystoreProperties['keyPassword']
            }
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:101.0.0'
    implementation 'org.luckypray:dexkit:2.2.0'
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.camera:camera-camera2:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.9.4'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
