apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def releaseKeystorePropertiesFile = rootProject.file('.signing/keystore.properties')
def releaseKeystoreProperties = new Properties()
def burnInShiftIntervalMs = project.findProperty('burnInShiftIntervalMs')?.toLong() ?: 180000L
def hardeningBuildId = project.findProperty('hardeningBuildId') ?: 'development'
def integrityWatchdogMs = project.findProperty('integrityWatchdogMs')?.toLong() ?: 15000L
def expectedCertSha256 = project.findProperty('expectedCertSha256') ?:
        'A3278D7A7A11754FE8D8042A0E2666CAEF60505DBD97DB7A1127B88BB622C7F9'
def releaseSigningEnabled = releaseKeystorePropertiesFile.exists() &&
        !project.hasProperty('unsignedRelease')
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystorePropertiesFile.withInputStream {
        releaseKeystoreProperties.load(it)
    }
}

android {
    namespace 'com.daxiaamu.mijiapanel'
    compileSdk 36

    buildFeatures {
        buildConfig true
        compose true
    }

    packaging {
        jniLibs {
            // Keep the universal APK, but deflate large ML Kit native libraries.
            // Android extracts them during installation on API 26+.
            useLegacyPackaging = true
        }
    }

    defaultConfig {
        applicationId 'com.daxiaamu.mijiapanel'
        minSdk 26
        targetSdk 35
        versionCode project.findProperty('versionCodeOverride')?.toInteger() ?: 30
        versionName project.findProperty('versionNameOverride') ?: '1.2.0'
        buildConfigField 'long', 'BURN_IN_SHIFT_INTERVAL_MS', "${burnInShiftIntervalMs}L"
        buildConfigField 'String', 'HARDENING_BUILD_ID', "\"${hardeningBuildId}\""
        buildConfigField 'long', 'INTEGRITY_WATCHDOG_MS', "${integrityWatchdogMs}L"
    }

    signingConfigs {
        debug {
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
        release {
            if (releaseKeystorePropertiesFile.exists()) {
                storeFile new File(
                        releaseKeystorePropertiesFile.parentFile,
                        releaseKeystoreProperties['storeFile'])
                storePassword releaseKeystoreProperties['storePassword']
                keyAlias releaseKeystoreProperties['keyAlias']
                keyPassword releaseKeystoreProperties['keyPassword']
            }
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'ENFORCE_INTEGRITY', 'false'
            buildConfigField 'String', 'EXPECTED_CERT_SHA256', '\"\"'
        }
        release {
            minifyEnabled true
            shrinkResources true
            buildConfigField 'boolean', 'ENFORCE_INTEGRITY', 'true'
            buildConfigField 'String', 'EXPECTED_CERT_SHA256',
                    "\"${expectedCertSha256}\""
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningEnabled) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:101.0.0'
    implementation 'org.luckypray:dexkit:2.2.0'
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.camera:camera-camera2:1.6.1'
    implementation 'androidx.camera:camera-lifecycle:1.6.1'
    implementation 'androidx.lifecycle:lifecycle-service:2.9.4'
    implementation 'com.google.mlkit:face-detection:16.1.7'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
